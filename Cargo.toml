[package]
name = "voice-mixer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
cpal = "=0.15.3"
nnnoiseless = { version = "0.5", default-features = false }
wasapi = "0.17"
sysinfo = "0.32"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tray-icon = "0.19"
winreg = "0.52"

[profile.release]
opt-level = 3
lto = true
strip = true
