[package]
name = "voice-mixer"
version = "0.3.2"
edition = "2021"

[dependencies]
eframe = "0.29"
cpal = "=0.15.3"
nnnoiseless = { version = "0.5", default-features = false }
wasapi = "0.17"
sysinfo = "0.32"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tray-icon = "0.19"
winreg = "0.52"
global-hotkey = "0.6"
rfd = "0.15"
symphonia = { version = "0.5", features = ["mp3", "aac", "wav", "ogg", "vorbis", "flac", "pcm", "isomp4"] }

[profile.release]
opt-level = 3
lto = true
strip = true
